<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Health Consultant</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <script src="/static/dashboard.js" defer></script>
</head>
<body>
    <main class="dashboard-wrapper">
        <header class="dashboard-header">
            <h2>Patient Dashboard</h2>
            <div class="header-actions">
                <a class="outline-button" href="/static/upload.html">Upload Document</a>
                <button type="button" id="logout-btn" class="logout-button">Secure Logout</button>
            </div>
        </header>

        <div class="dashboard-layout">
            <aside class="side-panel">
                <h3>Your Documents</h3>
                <p id="doc-count" class="metric-label">Loading...</p>
                <ul id="doc-list" class="doc-list"></ul>
            </aside>

            <section class="profile-panel">
                <div class="profile-header">
                    <h3>Medical Profile</h3>
                    <button type="button" id="copy-btn" class="cta-button" disabled>Copy for AI</button>
                </div>
                <p id="profile-updated" class="metric-label"></p>
                <p id="copy-status" class="copy-status" aria-live="polite"></p>

                <div id="profile-body"></div>

                <p class="disclaimer">
                    Generated from your uploaded documents and your edits. This is not medical advice.
                </p>
            </section>
        </div>
    </main>
</body>
</html>
